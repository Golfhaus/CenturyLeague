name: CenturyLeague CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  simulation-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run validate:generator
      - run: npm run validate:lifecycle
      - run: npm run validate:pool
      - run: npm run validate:players
      - run: npm run build:registry
