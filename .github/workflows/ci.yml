name: CenturyLeague CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  simulation-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: century_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run verify:match-baseline
      - run: npm run validate:matches
      - run: npm run validate:competition
      - run: npm run validate:replay
      - run: npm run validate:availability
      - run: npm run verify:competitive-source
      - run: npm run validate:roster-import
      - run: npm run validate:competition-db
        env:
          COMPETITION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/century_test
      - run: npm run validate:operations-db
        env:
          COMPETITION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/century_test
      - run: npm run validate:rehearsal-integration
        env:
          COMPETITION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/century_test
      - run: npm run validate:official-registry
        env:
          COMPETITION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/century_test
      - run: npm run validate:inaugural
        env:
          COMPETITION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/century_test
      - run: npm run validate:scheduled-runner
        env:
          COMPETITION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/century_test
      - run: npm run validate:generator
      - run: npm run validate:lifecycle
      - run: npm run validate:pool
      - run: npm run validate:players
      - run: npm run validate:edge-mirror
      - run: npm run build:registry
