name: Deploy Player Registry

on:
  push:
    branches: [main]
    paths:
      - 'apps/player-registry/**'
      - 'packages/database/**'
      - 'packages/simulation-core/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install
        run: npm install
      - name: Build registry
        run: npm run build:registry
        env:
          VITE_SUPABASE_URL: https://iarwopfebmjrtsypxeye.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_yvxRz0qYzlIJDwuQCtMCVw_wr3VXvjL
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/player-registry/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
